<!doctype html>
<html lang="es-AR">
    <head>
        <meta charset="utf-8" />
        <title>LECMA - Movilidad corporativa y traslados ejecutivos</title>
        <!-- Lo que muestra Google debajo del título (y WhatsApp, LinkedIn, etc. al compartir el enlace). -->
        <meta name="description" content="Traslados ejecutivos y movilidad corporativa para empresas, con choferes profesionales y vehículos premium. Buenos Aires, Rosario, San Nicolás y todo el país." />
        <!-- lecmaservicios.com y www.lecmaservicios.com muestran lo mismo: Google indexa una sola. -->
        <link rel="canonical" href="https://lecmaservicios.com/" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="LECMA" />
        <meta property="og:locale" content="es_AR" />
        <meta property="og:url" content="https://lecmaservicios.com/" />
        <meta property="og:title" content="LECMA - Movilidad corporativa y traslados ejecutivos" />
        <meta property="og:description" content="Traslados ejecutivos y movilidad corporativa para empresas, con choferes profesionales y vehículos premium. Buenos Aires, Rosario, San Nicolás y todo el país." />
        <meta property="og:image" content="https://lecmaservicios.com/icons/icon-512x512.png" />
        <meta name="twitter:card" content="summary" />
        <!-- Datos de la empresa para Google (nombre, logo, zona de servicio, contacto). -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "Organization",
                "name": "LECMA",
                "alternateName": "LECMA Servicios",
                "url": "https://lecmaservicios.com/",
                "logo": "https://lecmaservicios.com/icons/icon-512x512.png",
                "description": "Traslados ejecutivos y movilidad corporativa para empresas, con choferes profesionales y vehículos premium.",
                "email": "contacto@lecmaservicios.com",
                "areaServed": ["Buenos Aires", "Rosario", "San Nicolás", "Argentina"],
                "address": { "@type": "PostalAddress", "addressCountry": "AR", "addressRegion": "Buenos Aires" }
            }
        </script>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#1e40af" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="LECMA" />
        <link rel="preconnect" href="https://primefaces.org" />
        <link rel="icon" type="image/svg+xml" href="favicon.svg" />
        <link rel="apple-touch-icon" href="icons/icon-152x152.png" />
        <link rel="manifest" href="manifest.webmanifest" />
        <link href="https://fonts.cdnfonts.com/css/lato" rel="stylesheet" />
        <!-- Pantalla de carga: se ve mientras baja el sistema; Angular la reemplaza al arrancar. -->
        <style>
            .app-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.25rem; background: #f8f7f4; font-family: Lato, system-ui, sans-serif; }
            .app-splash svg { width: 64px; height: 64px; animation: splash-pulse 1.6s ease-in-out infinite; }
            .app-splash .name { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.35em; color: #0c2340; padding-left: 0.35em; }
            .app-splash .bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(12, 35, 64, 0.12); overflow: hidden; }
            .app-splash .bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 3px; background: #b39565; animation: splash-bar 1.2s ease-in-out infinite; }
            .splash-dark .app-splash { background: #0b1220; }
            .splash-dark .app-splash .name { color: #f1ede6; }
            .splash-dark .app-splash path { fill: #f1ede6; }
            .splash-dark .app-splash .bar { background: rgba(241, 237, 230, 0.15); }
            @keyframes splash-pulse { 50% { opacity: 0.55; transform: scale(0.94); } }
            @keyframes splash-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
            @media (prefers-reduced-motion: reduce) { .app-splash svg, .app-splash .bar::after { animation: none; } }
        </style>
        <script>
            try {
                if (localStorage.getItem('lecma-dark-theme') === 'true') document.documentElement.classList.add('splash-dark');
            } catch (e) {}
        </script>
    </head>

    <body>
        <app-root>
            <div class="app-splash" role="status" aria-label="Cargando">
                <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M 50 20 L 20 90 L 38 90 L 50 55 L 62 90 L 80 90 Z" fill="#0C2340" /></svg>
                <div class="name">LECMA</div>
                <div class="bar"></div>
            </div>
        </app-root>
        <script>
            if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/ngsw-worker.js');
                });
            }
        </script>
    </body>
</html>
